name: Tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  marco7:
    name: Marcos 7 e 8 — PostgreSQL e Playwright
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fuctura_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: fuctura_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fuctura_test -d fuctura_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://fuctura_test:local-ci-only@127.0.0.1:5432/fuctura_ci_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Schema, types, lint, build, services, integration and browser tests
        run: npm run test:all
      - name: Upload test reports, screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marcos7-8-test-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
